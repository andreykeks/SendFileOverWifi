log_format sendfile_download escape=json
  '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
  '"status":$status,"body_bytes_sent":$body_bytes_sent,'
  '"range":"$http_range","forwarded_for":"$http_x_forwarded_for"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # This host-mounted log is consumed on the server by download-report.py.
    # It is deliberately limited to server-side accounting; no browser tracker
    # or third-party analytics service is used.
    access_log /var/log/nginx/downloads.json sendfile_download;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
