plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ao.sendfileoverwifi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ao.sendfileoverwifi'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += '../../localization'
    }
}

dependencies {
    // Apache-2.0: TLS 1.3 exporter is required for the v1 SAS calculation.
    implementation 'org.conscrypt:conscrypt-android:2.7.0'
    // MIT-style licence; used only to create the local self-signed X.509 certificate.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.83'
    implementation 'androidx.core:core:1.15.0'
}
